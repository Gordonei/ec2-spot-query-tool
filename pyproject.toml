[project]
name = "ec2-spot-query-tool"
version = "0.1.0"
description = "Analyze and rank AWS Spot Market instances across multiple time horizons"
requires-python = ">=3.12"
dependencies = [
    "boto3",
    "pandas",
    "typer",
    "rich",
]

[project.scripts]
ec2-spot-query = "ec2_spot_query.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ec2_spot_query"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# PEP 8 style (E/W), pyflakes bug detection (F), and import sorting (I).
# E501 (line-too-long) is not enforced yet; the codebase has many long
# lines that will be wrapped incrementally.
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[dependency-groups]
dev = ["pytest", "pytest-mock", "ruff"]
