[project]
name = "ec2-spot-query-tool"
version = "0.1.0"
description = "Analyze and rank AWS Spot Market instances across multiple time horizons"
requires-python = ">=3.12"
dependencies = [
    "boto3",
    "pandas",
    "typer",
    "rich",
]

[project.scripts]
ec2-spot-query = "ec2_spot_query.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ec2_spot_query"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest", "pytest-mock"]
